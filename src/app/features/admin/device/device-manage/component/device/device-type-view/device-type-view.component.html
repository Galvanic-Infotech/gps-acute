<div class="modal-header text-center" style="color: #fff;">
    Device Types
    <div class="close-modal">
        <i class="fa fa-close" style="color: white; cursor: pointer;" (click)="close()"></i>
    </div>
</div>
<div class="modal-body p-20">
    <div class="_card white-bg">
        <div class="row" *ngIf="loading">
            <div class="col-md-12 text-center py-4">
                <i class="fa fa-spinner fa-spin fa-2x"></i>
                <p class="mt-2">Loading device types...</p>
            </div>
        </div>

        <div class="row" *ngIf="!loading && deviceTypes.length === 0">
            <div class="col-md-12 text-center py-4">
                <p class="text-muted">No device types available</p>
            </div>
        </div>

        <div class="row" *ngIf="!loading && deviceTypes.length > 0">
            <div class="col-md-12">
                <div class="table-responsive" style="max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px;">
                    <table class="table table-striped table-hover mb-0">
                        <thead style="position: sticky; top: 0; background-color: #f8f9fa; z-index: 10;">
                            <tr>
                                <th>Device Type Name</th>
                                <th>Port</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let type of deviceTypes">
                                <td>{{ type?.name || 'N/A' }}</td>
                                <td>{{ type?.serverPort || 'N/A' }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="footer mt-3">
        <div class="row">
            <div class="col-md-12 text-end">
                <button class="btn btn-secondary" (click)="close()">Close</button>
            </div>
        </div>
    </div>
</div>
